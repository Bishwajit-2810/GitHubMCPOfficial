name: Backend CI

on:
  push:
    branches: [main, working-v2]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5434/ai_db
      JWT_SECRET: ci-test-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: "3600"
      TOKEN_ENCRYPTION_KEY: dGVzdC1rZXktZm9yLXB5dGVzdC10ZXN0LWtleS1mb3I=
      GITHUB_TOKEN: ci-fake-token
      GITHUB_OWNER: ci-owner
      GITHUB_REPO: ci-repo
      PROJECT_ID: "1"
      GROQ_API_KEY: ci-fake-groq-key
      GITHUB_CLIENT_ID: ci-client-id
      GITHUB_CLIENT_SECRET: ci-client-secret
      RAG_VECTOR_DB: chroma

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint with black (check only)
        run: uv run black --check github_mcp/ api_server.py tests/ || true

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Verify MCP server imports
        run: uv run python -c "from github_mcp.config import validate_config; print('config OK')"
