name: frontend
description: "GitHub MCP Flutter app — Firebase auth + GitHub OAuth + BFF REST API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  provider: ^6.1.2
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Non-sensitive preferences (flags, simple settings)
  shared_preferences: ^2.3.3

  # Structured local storage (tasks cache, context cache)
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.1
  google_sign_in: ^6.2.2

  # In-app browser for GitHub backend OAuth (repo/project scopes)
  flutter_web_auth_2: ^4.0.1

  # Animations
  lottie: ^3.1.0
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^0.69.0

  # Skeleton loading
  shimmer: ^3.0.0

  # Typography
  google_fonts: ^6.2.1

  # Markdown rendering (LLM responses)
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
